spring.application.name=demo
server.port=${SERVER_PORT:10202}

# Local values belong in demo/.env (copy .env.example); do not commit credentials.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/user_auth?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA ??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.web.resources.static-locations=classpath:/static/
# backend/src/main/resources/application.properties??????
upload.path=${UPLOAD_PATH:./src/main/resources/static/images}
uploads.path=${UPLOADS_PATH:./src/main/resources/static/uploads}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
